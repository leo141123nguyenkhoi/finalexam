
spring.application.name=FinalExamBackend

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

springdoc.swagger-ui.path=/swagger-ui.html

logging.file.name=Application.log
logging.level.com.vti=INFO

spring.messages.basename=messages
spring.messages.encoding=UTF-8

app.cors.allowed-origins=${CORS_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}

app.frontend.url=${FRONTEND_URL:http://127.0.0.1:5500}

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.dev-log=${MAIL_DEV_LOG:false}

app.jwt.secret=${JWT_SECRET:local-only-replace-this-long-jwt-secret-before-deploy-12345678}


spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

logging.file.name=Application.log
logging.level.root=INFO
logging.level.com.vti=INFO
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

logging.pattern.level=%5p [requestId:%X{requestId:-none}]
